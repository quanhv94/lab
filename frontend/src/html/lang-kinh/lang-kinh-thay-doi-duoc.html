<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>Bài 18. Tia sáng qua lăng kính</title>
<style>
html, body { height: 100%; margin: 0; }
body { font-family: system-ui, sans-serif; background: #f5f6fa; color: #222; display: flex; flex-direction: column; box-sizing: border-box; padding: 12px 16px; }
h1 { font-size: 18px; margin: 0 0 8px; line-height: 1.35; flex: 0 0 auto; }
.back { display: inline-block; margin-bottom: 8px; padding: 8px 14px; background: #fff; border: 1px solid #ccc; border-radius: 6px; color: #6a1b9a; text-decoration: none; font-weight: 600; font-size: 14px; flex: 0 0 auto; align-self: flex-start; }
.back:hover { background: #f3e5f5; }
.wrap { flex: 1 1 auto; display: flex; gap: 12px; min-height: 0; align-items: stretch; }
canvas { flex: 1 1 auto; width: 100%; height: 100%; min-width: 0; background: #fff; border: 1px solid #ccc; border-radius: 6px; cursor: grab; }
.panel { flex: 0 0 250px; width: 250px; box-sizing: border-box; background: #fff; border: 1px solid #ccc; border-radius: 6px; padding: 12px 16px; overflow: auto; }
.panel label { display: block; margin-top: 10px; font-weight: 600; font-size: 14px; }
.panel input[type=range] { width: 100%; }
.result { margin-top: 14px; line-height: 1.7; font-size: 14px; }
.result b { color: #6a1b9a; }
.note { font-size: 13px; color: #555; margin-top: 12px; }
</style>
</head>
<body>
<a class="back" href="index.html">← Quay lại</a>
<h1>Bài 18. Đường đi tia sáng qua lăng kính (kéo đỉnh / nguồn)</h1>
<div class="wrap">
  <canvas id="cv"></canvas>
  <div class="panel">
    <label>Chiết suất n = <span id="nVal"></span></label>
    <input id="nIn" type="range" min="1.1" max="2" step="0.01" value="1.5" />
    <label>Góc tia tới so với ngang α = <span id="alphaVal"></span>°</label>
    <input id="alpha" type="range" min="-180" max="180" step="0.5" value="0" />
    <p class="note">Kéo nguồn <b>S</b> và 3 đỉnh A, B, C. Có thể đặt S trong hoặc ngoài lăng kính. Tại mỗi cạnh: khúc xạ hoặc phản xạ toàn phần tùy góc tới.</p>
    <div class="result" id="result"></div>
    <p class="note" id="note"></p>
  </div>
</div>
<script>
const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');
const N_AIR = 1;
const MAX_BOUNCES = 6;
const viewport = { width: 0, height: 0 };

function clear() { ctx.clearRect(0, 0, viewport.width, viewport.height); }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function toDeg(r) { return (r * 180) / Math.PI; }
function toRad(d) { return (d * Math.PI) / 180; }
function normalize(v) {
  const n = Math.hypot(v.x, v.y) || 1;

  return { x: v.x / n, y: v.y / n };
}
function dot(a, b) { return a.x * b.x + a.y * b.y; }
function add(a, b) { return { x: a.x + b.x, y: a.y + b.y }; }
function scale(v, s) { return { x: v.x * s, y: v.y * s }; }
function sub(a, b) { return { x: a.x - b.x, y: a.y - b.y }; }

function line(a, b, { color = '#333', width = 2, dash = [] } = {}) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.setLineDash(dash);
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.lineTo(b.x, b.y);
  ctx.stroke();
  ctx.restore();
}
function fillCircle(p, r, color) {
  ctx.beginPath();
  ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
}
function label(t, p, color = '#222', ox = 8, oy = -8) {
  ctx.fillStyle = color;
  ctx.font = '14px system-ui';
  ctx.fillText(t, p.x + ox, p.y + oy);
}
function arrow(a, b, color) {
  line(a, b, { color, width: 2.5 });
  const ang = Math.atan2(b.y - a.y, b.x - a.x);
  ctx.save();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(b.x, b.y);
  ctx.lineTo(b.x - 10 * Math.cos(ang - 0.4), b.y - 10 * Math.sin(ang - 0.4));
  ctx.lineTo(b.x - 10 * Math.cos(ang + 0.4), b.y - 10 * Math.sin(ang + 0.4));
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function mouse(e) {
  const r = canvas.getBoundingClientRect();

  return {
    x: ((e.clientX - r.left) * viewport.width) / r.width,
    y: ((e.clientY - r.top) * viewport.height) / r.height,
  };
}

function snell(dir, normalOut, n1, n2) {
  let n = normalize(normalOut);
  const d = normalize(dir);

  if (dot(d, n) > 0) {
    n = { x: -n.x, y: -n.y };
  }

  const cosi = clamp(-dot(d, n), -1, 1);
  const i = Math.acos(cosi);
  const sinr = (n1 / n2) * Math.sin(i);

  if (Math.abs(sinr) > 1) {
    return { i, r: null, dir: null, tir: true };
  }

  const r = Math.asin(sinr);
  const eta = n1 / n2;
  const k = 1 - eta * eta * (1 - cosi * cosi);
  const out = normalize({
    x: eta * d.x + (eta * cosi - Math.sqrt(k)) * n.x,
    y: eta * d.y + (eta * cosi - Math.sqrt(k)) * n.y,
  });

  return { i, r, dir: out, tir: false };
}

function reflectDir(dir, normalOut) {
  let n = normalize(normalOut);

  if (dot(dir, n) > 0) {
    n = { x: -n.x, y: -n.y };
  }

  return normalize({
    x: dir.x - 2 * dot(dir, n) * n.x,
    y: dir.y - 2 * dot(dir, n) * n.y,
  });
}

function centroid(pts) {
  let x = 0;
  let y = 0;

  for (const p of pts) {
    x += p.x;
    y += p.y;
  }

  return { x: x / pts.length, y: y / pts.length };
}

function apexAngle(v) {
  const [A, B, C] = v;
  const ab = Math.atan2(B.y - A.y, B.x - A.x);
  const ac = Math.atan2(C.y - A.y, C.x - A.x);
  let ang = Math.abs(ab - ac);

  if (ang > Math.PI) {
    ang = 2 * Math.PI - ang;
  }

  return ang;
}

function getEdges(v) {
  const c = centroid(v);
  const edges = [];

  for (let i = 0; i < 3; i++) {
    const a = v[i];
    const b = v[(i + 1) % 3];
    const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    const edgeDirection = sub(b, a);
    let outward = normalize({ x: edgeDirection.y, y: -edgeDirection.x });

    // Pháp tuyến phải vuông góc cạnh và hướng ra ngoài tam giác.
    if (dot(outward, sub(c, mid)) > 0) {
      outward = { x: -outward.x, y: -outward.y };
    }

    edges.push({ a, b, outward, index: i, name: ['AB', 'BC', 'CA'][i] });
  }

  return edges;
}

function isPointInsideTriangle(p, triangle) {
  const [a, b, c] = triangle;
  const cross = (p1, p2, p3) =>
    (p2.x - p1.x) * (p3.y - p1.y) - (p2.y - p1.y) * (p3.x - p1.x);
  const d1 = cross(a, b, p);
  const d2 = cross(b, c, p);
  const d3 = cross(c, a, p);
  const hasNegative = d1 < 0 || d2 < 0 || d3 < 0;
  const hasPositive = d1 > 0 || d2 > 0 || d3 > 0;

  return !(hasNegative && hasPositive);
}

function raySegHit(origin, dir, a, b) {
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const det = dir.x * dy - dir.y * dx;

  if (Math.abs(det) < 1e-9) {
    return null;
  }

  const ox = a.x - origin.x;
  const oy = a.y - origin.y;
  const t = (ox * dy - oy * dx) / det;
  const u = (ox * dir.y - oy * dir.x) / det;

  if (t > 1e-4 && u >= -1e-6 && u <= 1 + 1e-6) {
    return { t, point: { x: origin.x + dir.x * t, y: origin.y + dir.y * t }, u };
  }

  return null;
}

function findHit(origin, dir, edges, excludeIndex = -1) {
  let best = null;

  for (const edge of edges) {
    if (edge.index === excludeIndex) {
      continue;
    }

    const hit = raySegHit(origin, dir, edge.a, edge.b);

    if (hit && (!best || hit.t < best.t)) {
      best = { ...hit, edge };
    }
  }

  return best;
}

function drawNormal(p, n, len = 32) {
  line(p, add(p, scale(n, len)), { color: '#9e9e9e', width: 1.5, dash: [3, 3] });
}

const state = {
  v: null,
  S: null,
};

let drag = null;

canvas.addEventListener('mousedown', (e) => {
  const p = mouse(e);

  if (state.S && dist(p, state.S) < 16) {
    drag = 'S';

    return;
  }

  if (state.v) {
    for (let i = 0; i < 3; i++) {
      if (dist(p, state.v[i]) < 14) {
        drag = 'v' + i;

        return;
      }
    }
  }
});
window.addEventListener('mouseup', () => { drag = null; });
canvas.addEventListener('mousemove', (e) => {
  const p = mouse(e);
  const W = viewport.width;
  const H = viewport.height;

  if (drag === 'S') {
    state.S = { x: clamp(p.x, 20, W - 20), y: clamp(p.y, 20, H - 20) };
    render();

    return;
  }

  if (drag && drag.startsWith('v')) {
    state.v[+drag[1]] = { x: clamp(p.x, 40, W - 40), y: clamp(p.y, 40, H - 40) };
    render();

    return;
  }

  let cur = 'default';

  if (state.S && dist(p, state.S) < 16) {
    cur = 'grab';
  } else if (state.v) {
    for (let i = 0; i < 3; i++) {
      if (dist(p, state.v[i]) < 14) {
        cur = 'grab';
      }
    }
  }

  canvas.style.cursor = cur;
});

['nIn', 'alpha'].forEach((id) => {
  document.getElementById(id).oninput = () => render();
});
window.addEventListener('resize', resize);

function resize() {
  const rect = canvas.getBoundingClientRect();
  const pixelRatio = Math.max(1, window.devicePixelRatio || 1);
  viewport.width = Math.max(480, Math.floor(rect.width));
  viewport.height = Math.max(360, Math.floor(rect.height));
  canvas.width = Math.round(viewport.width * pixelRatio);
  canvas.height = Math.round(viewport.height * pixelRatio);
  ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
  const W = viewport.width;
  const H = viewport.height;

  if (!state.v) {
    state.v = [
      { x: W * 0.5, y: H * 0.22 },
      { x: W * 0.28, y: H * 0.72 },
      { x: W * 0.72, y: H * 0.72 },
    ];
  }

  if (!state.S) {
    state.S = { x: W * 0.5, y: H * 0.5 };
  } else {
    state.S.x = clamp(state.S.x, 20, W - 20);
    state.S.y = clamp(state.S.y, 20, H - 20);
  }

  render();
}

function render() {
  const W = viewport.width;
  const H = viewport.height;

  if (!W || !H || !state.v || !state.S) {
    return;
  }

  clear();
  const nGlass = +document.getElementById('nIn').value;
  const alphaDeg = +document.getElementById('alpha').value;
  document.getElementById('nVal').textContent = nGlass.toFixed(2);
  document.getElementById('alphaVal').textContent = alphaDeg.toFixed(1);

  const [A, B, C] = state.v;
  const edges = getEdges(state.v);
  const angA = apexAngle(state.v);
  const iCrit = Math.asin(N_AIR / nGlass);

  // Lăng kính
  ctx.beginPath();
  ctx.moveTo(A.x, A.y);
  ctx.lineTo(B.x, B.y);
  ctx.lineTo(C.x, C.y);
  ctx.closePath();
  ctx.fillStyle = 'rgba(30,136,229,0.15)';
  ctx.fill();
  ctx.strokeStyle = '#1565c0';
  ctx.lineWidth = 3;
  ctx.stroke();
  state.v.forEach((p, i) => {
    fillCircle(p, 8, '#1565c0');
    label(['A', 'B', 'C'][i], p, '#1565c0');
  });

  // Ngang tham chiếu
  line({ x: 16, y: H / 2 }, { x: W - 16, y: H / 2 }, { color: '#bbb', width: 1, dash: [6, 5] });

  // α > 0 hướng lên ⇒ dy âm
  const alpha = toRad(alphaDeg);
  let dir = normalize({ x: Math.cos(alpha), y: -Math.sin(alpha) });

  fillCircle(state.S, 9, '#ffeb3b');
  ctx.beginPath();
  ctx.arc(state.S.x, state.S.y, 9, 0, Math.PI * 2);
  ctx.strokeStyle = '#f9a825';
  ctx.lineWidth = 2;
  ctx.stroke();
  label('S', state.S, '#f57f17', 12, -8);

  const events = [];
  let origin = { ...state.S };
  let exclude = -1;
  let emerged = false;
  let isInside = isPointInsideTriangle(state.S, state.v);
  let pathColor = isInside ? '#1565c0' : '#e53935';

  for (let bounce = 0; bounce <= MAX_BOUNCES; bounce++) {
    const hit = findHit(origin, dir, edges, exclude);

    if (!hit) {
      arrow(origin, add(origin, scale(dir, Math.hypot(W, H))), pathColor);

      if (!isInside && events.length === 0) {
        events.push('Tia từ S không cắt lăng kính.');
      } else {
        events.push('Tia không gặp cạnh tiếp theo.');
      }

      break;
    }

    arrow(origin, hit.point, pathColor);
    drawNormal(hit.point, hit.edge.outward);
    fillCircle(hit.point, 4, '#000');
    label(bounce === 0 ? 'I' : `P${bounce}`, hit.point, '#000', 8, -8);

    if (!isInside) {
      // Không khí → lăng kính: luôn khúc xạ vào trong.
      const enter = snell(dir, hit.edge.outward, N_AIR, nGlass);
      events.push(
        `Vào tại ${hit.edge.name}: i = ${toDeg(enter.i).toFixed(1)}°, `
        + `r = ${toDeg(enter.r).toFixed(1)}°`,
      );
      dir = enter.dir;
      origin = hit.point;
      exclude = hit.edge.index;
      isInside = true;
      pathColor = '#1565c0';
      continue;
    }

    // Lăng kính → không khí: khúc xạ hoặc phản xạ toàn phần.
    const exit = snell(dir, hit.edge.outward, nGlass, N_AIR);

    if (exit.tir || !exit.dir) {
      const refl = reflectDir(dir, hit.edge.outward);
      events.push(
        `Tại ${hit.edge.name}: i = ${toDeg(exit.i).toFixed(1)}° &gt; i<sub>gh</sub> `
        + `(${toDeg(iCrit).toFixed(1)}°) → <b>phản xạ toàn phần</b>`,
      );
      dir = refl;
      origin = hit.point;
      exclude = hit.edge.index;
      pathColor = '#6a1b9a';
      continue;
    }

    events.push(
      `Ra tại ${hit.edge.name}: i = ${toDeg(exit.i).toFixed(1)}°, r = ${toDeg(exit.r).toFixed(1)}° → <b>khúc xạ ra KK</b>`,
    );
    arrow(hit.point, add(hit.point, scale(exit.dir, 180)), '#2e7d32');
    emerged = true;
    break;
  }

  document.getElementById('result').innerHTML =
    `Góc chiết quang A ≈ <b>${toDeg(angA).toFixed(1)}°</b><br>`
    + `n = ${nGlass.toFixed(2)}, i<sub>gh</sub> = arcsin(1/n) = <b>${toDeg(iCrit).toFixed(1)}°</b><br>`
    + `Nguồn S: <b>${isPointInsideTriangle(state.S, state.v) ? 'trong lăng kính' : 'ngoài lăng kính'}</b><br>`
    + events.join('<br>');
  document.getElementById('note').textContent = emerged
    ? 'Đỏ: tia tới. Xanh dương: trong kính. Xanh lá: tia ló. Tím: phản xạ toàn phần.'
    : 'Đỏ: tia tới. Trong kính có phản xạ toàn phần (tím) — chưa ra ngoài.';
}

resize();
</script>
</body>
</html>
