<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>Bài 9. Ba gương tạo thành tam giác cân — tia sáng vào hệ</title>
<style>
body { font-family: system-ui, sans-serif; margin: 16px; background: #f5f6fa; color: #222; }
h1 { font-size: 18px; margin: 0 0 12px; max-width: 1100px; line-height: 1.35; }
.back { display: inline-block; margin-bottom: 12px; padding: 8px 14px; background: #fff; border: 1px solid #ccc; border-radius: 6px; color: #6a1b9a; text-decoration: none; font-weight: 600; font-size: 14px; }
.back:hover { background: #f3e5f5; }
.wrap { display: flex; gap: 16px; flex-wrap: nowrap; align-items: flex-start; width: 100%; }
canvas { flex: 1 1 0; width: 100%; min-width: 0; background: #fff; border: 1px solid #ccc; border-radius: 6px; cursor: grab; }
.panel { flex: 0 0 250px; width: 250px; box-sizing: border-box; background: #fff; border: 1px solid #ccc; border-radius: 6px; padding: 12px 16px; }
.panel label { display: block; margin-top: 10px; font-weight: 600; font-size: 14px; }
.panel input[type=range] { width: 100%; }
.result { margin-top: 14px; line-height: 1.7; font-size: 14px; }
.result b { color: #6a1b9a; }
.note { font-size: 13px; color: #555; margin-top: 12px; }
</style>
</head>
<body>
<a class="back" href="index.html">← Quay lại</a>
<h1>Bài 9. Ba gương tạo thành tam giác cân ABC (cân tại A)</h1>
<div class="wrap">
  <canvas id="cv" width="1000" height="560"></canvas>
  <div class="panel">
    <label>Độ dài AB = AC = <span id="abVal"></span> px</label>
    <input id="abLen" type="range" min="120" max="320" step="1" value="240" />
    <label>Góc tại A = <span id="angAVal"></span>°</label>
    <input id="angA" type="range" min="20" max="140" step="1" value="70" />

    <label>Vị trí lỗ trên cạnh AC: <span id="holePosVal"></span></label>
    <input id="holePos" type="range" min="0.15" max="0.85" step="0.01" value="0.45" />

    <p class="note">Tam giác cân tại A (AB = AC). Lỗ trên AC (rộng 20 px); S cố định trên pháp tuyến vuông góc AC tại lỗ. Mỗi gương phản xạ tối đa 2 lần. Kéo tâm lỗ.</p>
    <div class="result" id="result"></div>
    <p class="note" id="note"></p>
  </div>
</div>
<script>
const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

function clear() { ctx.clearRect(0, 0, W, H); }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function mouse(e) {
  const r = canvas.getBoundingClientRect();

  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
function line(a, b, { color = '#333', width = 2, dash = [] } = {}) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.setLineDash(dash);
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.lineTo(b.x, b.y);
  ctx.stroke();
  ctx.restore();
}
function fillCircle(p, r, color) {
  ctx.beginPath();
  ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
}
function label(t, p, color = '#222', ox = 8, oy = -8) {
  ctx.fillStyle = color;
  ctx.font = '14px system-ui';
  ctx.fillText(t, p.x + ox, p.y + oy);
}
function arrow(a, b, color) {
  line(a, b, { color, width: 2 });
  const ang = Math.atan2(b.y - a.y, b.x - a.x);
  ctx.save();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(b.x, b.y);
  ctx.lineTo(b.x - 10 * Math.cos(ang - 0.4), b.y - 10 * Math.sin(ang - 0.4));
  ctx.lineTo(b.x - 10 * Math.cos(ang + 0.4), b.y - 10 * Math.sin(ang + 0.4));
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}
function reflect(dir, normal) {
  const n = Math.hypot(normal.x, normal.y) || 1;
  const nx = normal.x / n;
  const ny = normal.y / n;
  const d = 2 * (dir.x * nx + dir.y * ny);

  return { x: dir.x - d * nx, y: dir.y - d * ny };
}
function normalize(v) {
  const n = Math.hypot(v.x, v.y) || 1;

  return { x: v.x / n, y: v.y / n };
}
function toRad(d) { return (d * Math.PI) / 180; }
function toDeg(r) { return (r * 180) / Math.PI; }

let drag = null;
canvas.addEventListener('mousedown', (e) => { drag = hitTest(mouse(e)); });
window.addEventListener('mouseup', () => { drag = null; });
canvas.addEventListener('mousemove', (e) => {
  if (!drag) {
    return;
  }

  onDrag(drag, mouse(e));
  render();
});

// Cạnh: 0 = AB, 1 = BC, 2 = CA (= AC, có lỗ)
const EDGE_AB = 0;
const EDGE_BC = 1;
const EDGE_CA = 2;
const HOLE_EDGE = EDGE_CA;
const MAX_REFLECT_PER_MIRROR = 2;

const state = {
  ab: 240,
  angleA: 70,
  A: { x: 0, y: 0 },
  B: { x: 0, y: 0 },
  C: { x: 0, y: 0 },
  S: { x: 120, y: 300 },
  holePos: 0.45,
  holeSize: 20,
};

function buildTriangle() {
  const ab = state.ab;
  const halfA = toRad(state.angleA) / 2;
  // A ở trên, BC đáy; AB = AC = ab; cân tại A
  const ax = W / 2;
  const ay = 80;
  state.A = { x: ax, y: ay };
  state.B = {
    x: ax - ab * Math.sin(halfA),
    y: ay + ab * Math.cos(halfA),
  };
  state.C = {
    x: ax + ab * Math.sin(halfA),
    y: ay + ab * Math.cos(halfA),
  };
}

function vertices() {
  return [state.A, state.B, state.C];
}

function edgesOf() {
  return [
    [state.A, state.B], // AB
    [state.B, state.C], // BC
    [state.C, state.A], // CA = AC
  ];
}

function baseAngles() {
  // Tam giác cân: ∠B = ∠C = (180 − ∠A) / 2
  return (180 - state.angleA) / 2;
}

function holeBounds() {
  const [a, b] = edgesOf()[HOLE_EDGE];
  const len = dist(a, b);
  const half = state.holeSize / (2 * len);
  const t0 = clamp(state.holePos - half, 0.02, 0.98);
  const t1 = clamp(state.holePos + half, 0.02, 0.98);

  return {
    a,
    b,
    t0,
    t1,
    left: { x: a.x + (b.x - a.x) * t0, y: a.y + (b.y - a.y) * t0 },
    right: { x: a.x + (b.x - a.x) * t1, y: a.y + (b.y - a.y) * t1 },
    center: {
      x: a.x + (b.x - a.x) * state.holePos,
      y: a.y + (b.y - a.y) * state.holePos,
    },
  };
}

function isOnHole(hit, edgeIndex) {
  if (edgeIndex !== HOLE_EDGE || hit.u == null) {
    return false;
  }

  const { t0, t1 } = holeBounds();

  return hit.u >= t0 && hit.u <= t1;
}

['abLen', 'angA', 'holePos'].forEach((id) => {
  document.getElementById(id).oninput = () => render();
});

function hitTest(p) {
  const hole = holeBounds();

  if (dist(p, hole.center) < 16) {
    return 'hole';
  }

  return null;
}

function onDrag(which, p) {
  if (which === 'hole') {
    const [a, b] = edgesOf()[HOLE_EDGE];
    const len2 = (b.x - a.x) ** 2 + (b.y - a.y) ** 2 || 1;
    state.holePos = clamp(((p.x - a.x) * (b.x - a.x) + (p.y - a.y) * (b.y - a.y)) / len2, 0.15, 0.85);
    document.getElementById('holePos').value = state.holePos;
  }
}

function segIntersect(p1, p2, a, b) {
  const d = (p1.x - p2.x) * (a.y - b.y) - (p1.y - p2.y) * (a.x - b.x);

  if (Math.abs(d) < 1e-9) {
    return null;
  }

  const t = ((p1.x - a.x) * (a.y - b.y) - (p1.y - a.y) * (a.x - b.x)) / d;
  const u = ((p1.x - a.x) * (p1.y - p2.y) - (p1.y - a.y) * (p1.x - p2.x)) / d;

  if (t < 1e-6 || t > 1 - 1e-6 || u < 0 || u > 1) {
    return null;
  }

  return {
    x: p1.x + t * (p2.x - p1.x),
    y: p1.y + t * (p2.y - p1.y),
    u,
    edge: [a, b],
  };
}

function inwardNormal(a, b) {
  const c = {
    x: (state.A.x + state.B.x + state.C.x) / 3,
    y: (state.A.y + state.B.y + state.C.y) / 3,
  };
  let nx = b.y - a.y;
  let ny = a.x - b.x;
  const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };

  if ((mid.x + nx - c.x) ** 2 + (mid.y + ny - c.y) ** 2 > (mid.x - nx - c.x) ** 2 + (mid.y - ny - c.y) ** 2) {
    nx = -nx;
    ny = -ny;
  }

  return normalize({ x: nx, y: ny });
}

function findNearestHit(p, dir, edges, reflectCount) {
  const far = { x: p.x + dir.x * 3000, y: p.y + dir.y * 3000 };
  let best = null;
  let bestEdge = -1;

  edges.forEach((edge, i) => {
    const h = segIntersect(p, far, edge[0], edge[1]);

    if (!h) {
      return;
    }

    // Cạnh đã phản xạ đủ 2 lần: vẫn cho đi qua lỗ, nhưng không phản xạ lại
    if (reflectCount[i] >= MAX_REFLECT_PER_MIRROR && !isOnHole(h, i)) {
      return;
    }

    if (!best || dist(p, h) < dist(p, best)) {
      best = h;
      bestEdge = i;
    }
  });

  if (!best) {
    return null;
  }

  best.edgeIndex = bestEdge;

  return best;
}

function drawAngleAt(p, q1, q2, text, color = '#6a1b9a') {
  const a1 = Math.atan2(q1.y - p.y, q1.x - p.x);
  const a2 = Math.atan2(q2.y - p.y, q2.x - p.x);
  let delta = a2 - a1;

  while (delta > Math.PI) {
    delta -= 2 * Math.PI;
  }

  while (delta <= -Math.PI) {
    delta += 2 * Math.PI;
  }

  const r = 34;
  ctx.beginPath();
  ctx.arc(p.x, p.y, r, a1, a1 + delta, delta < 0);
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.stroke();
  const mid = a1 + delta / 2;
  label(text, {
    x: p.x + (r + 12) * Math.cos(mid),
    y: p.y + (r + 12) * Math.sin(mid),
  }, color, -14, 4);
}

function drawMirrors() {
  const edges = edgesOf();
  const hole = holeBounds();
  const names = ['AB', 'BC', 'AC'];

  edges.forEach(([a, b], i) => {
    if (i === HOLE_EDGE) {
      line(a, hole.left, { color: '#1565c0', width: 5 });
      line(hole.right, b, { color: '#1565c0', width: 5 });
      line(hole.left, hole.right, { color: '#43a047', width: 3, dash: [6, 5] });
      fillCircle(hole.left, 4, '#43a047');
      fillCircle(hole.right, 4, '#43a047');
      label('Lỗ', hole.center, '#2e7d32', -10, -14);
    } else {
      line(a, b, { color: '#1565c0', width: 5 });
    }

    const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    label(names[i], mid, '#1565c0', i === EDGE_BC ? -12 : 10, i === EDGE_AB ? 4 : -8);
  });
}

const S_DISTANCE = 110;

/** S nằm trên pháp tuyến vuông góc AC tại tâm lỗ (phía ngoài tam giác). */
function placeSPerpendicularToAC() {
  const hole = holeBounds();
  // Pháp tuyến cạnh CA (= AC): hướng ra ngoài
  const outward = (() => {
    const n = inwardNormal(state.C, state.A);

    return { x: -n.x, y: -n.y };
  })();

  state.S = {
    x: hole.center.x + outward.x * S_DISTANCE,
    y: hole.center.y + outward.y * S_DISTANCE,
  };
}

function render() {
  clear();
  state.ab = +document.getElementById('abLen').value;
  state.angleA = +document.getElementById('angA').value;
  state.holePos = +document.getElementById('holePos').value;
  document.getElementById('abVal').textContent = state.ab;
  document.getElementById('angAVal').textContent = state.angleA;
  document.getElementById('holePosVal').textContent = Math.round(state.holePos * 100) + '%';

  buildTriangle();
  placeSPerpendicularToAC();

  const edges = edgesOf();
  const hole = holeBounds();
  const base = baseAngles();
  const bc = dist(state.B, state.C);

  ctx.beginPath();
  ctx.moveTo(state.A.x, state.A.y);
  ctx.lineTo(state.B.x, state.B.y);
  ctx.lineTo(state.C.x, state.C.y);
  ctx.closePath();
  ctx.fillStyle = 'rgba(21,101,192,0.08)';
  ctx.fill();

  drawMirrors();
  drawAngleAt(state.A, state.B, state.C, `∠A=${state.angleA}°`);
  drawAngleAt(state.B, state.A, state.C, `∠B=${base.toFixed(0)}°`);
  drawAngleAt(state.C, state.A, state.B, `∠C=${base.toFixed(0)}°`);

  fillCircle(state.A, 8, '#1565c0');
  fillCircle(state.B, 8, '#1565c0');
  fillCircle(state.C, 8, '#1565c0');
  label('A', state.A, '#1565c0', -6, -14);
  label('B', state.B, '#1565c0', -18, 16);
  label('C', state.C, '#1565c0', 8, 16);

  // Pháp tuyến vuông góc AC tại lỗ (tia tới)
  line(state.S, hole.center, { color: '#9e9e9e', width: 1.5, dash: [5, 4] });
  label('⊥ AC', {
    x: (state.S.x + hole.center.x) / 2,
    y: (state.S.y + hole.center.y) / 2,
  }, '#757575', 8, -8);

  let p = { ...state.S };
  let dir = normalize({ x: hole.center.x - p.x, y: hole.center.y - p.y });
  const colors = ['#e53935', '#ef6c00', '#2e7d32', '#6a1b9a', '#00838f', '#ad1457'];
  const events = [];
  const reflectCount = [0, 0, 0];
  let inside = false;
  let totalReflections = 0;
  const edgeNames = ['AB', 'BC', 'AC'];

  for (let step = 0; step < 12; step++) {
    const hit = findNearestHit(p, dir, edges, reflectCount);

    if (!hit) {
      arrow(p, { x: p.x + dir.x * 180, y: p.y + dir.y * 180 }, colors[Math.min(events.length, 5)]);
      break;
    }

    const throughHole = isOnHole(hit, hit.edgeIndex);

    if (!inside && !throughHole) {
      arrow(p, hit, '#999');
      events.push('chạm gương (chưa vào lỗ)');
      break;
    }

    arrow(p, hit, colors[Math.min(events.length, 5)]);

    if (throughHole) {
      events.push(inside ? 'ra lỗ' : 'vào lỗ');
      p = { x: hit.x + dir.x * 1.5, y: hit.y + dir.y * 1.5 };
      inside = !inside;

      if (!inside) {
        arrow(p, { x: p.x + dir.x * 140, y: p.y + dir.y * 140 }, colors[Math.min(events.length, 5)]);
        break;
      }

      continue;
    }

    if (reflectCount[hit.edgeIndex] >= MAX_REFLECT_PER_MIRROR) {
      arrow(p, { x: p.x + dir.x * 140, y: p.y + dir.y * 140 }, '#999');
      events.push(`${edgeNames[hit.edgeIndex]} đã đủ 2 lần px`);
      break;
    }

    reflectCount[hit.edgeIndex] += 1;
    const n = inwardNormal(hit.edge[0], hit.edge[1]);
    dir = reflect(dir, n);
    p = { x: hit.x + dir.x * 1.5, y: hit.y + dir.y * 1.5 };
    totalReflections += 1;
    events.push(`px ${edgeNames[hit.edgeIndex]} (${reflectCount[hit.edgeIndex]}/2)`);
    inside = true;
  }

  fillCircle(state.S, 8, '#e53935');
  label('S', state.S);

  document.getElementById('result').innerHTML =
    `Tam giác cân tại A: <b>AB = AC = ${state.ab}</b> px, <b>BC = ${bc.toFixed(0)}</b> px<br>`
    + `∠A = <b>${state.angleA}°</b>, ∠B = ∠C = <b>${base.toFixed(1)}°</b><br>`
    + `S cố định: tia <b>vuông góc AC</b> tại lỗ. Mỗi gương ≤ <b>2</b> lần phản xạ.<br>`
    + `Tổng phản xạ: <b>${totalReflections}</b> — ${events.join(' → ') || '—'}`;
  document.getElementById('note').textContent =
    'Chỉnh AB, ∠A hoặc vị trí lỗ — S luôn nằm trên pháp tuyến AC tại lỗ.';
}

buildTriangle();
placeSPerpendicularToAC();
render();
</script>
<script src="../canvas-hidpi.js"></script>
</body>
</html>
