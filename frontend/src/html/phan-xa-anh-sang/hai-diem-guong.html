<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>Bài 2. Gương phẳng và hai điểm A, B — vùng nhìn thấy ảnh của nhau</title>
<style>
body { font-family: system-ui, sans-serif; margin: 16px; background: #f5f6fa; color: #222; }
h1 { font-size: 18px; margin: 0 0 12px; max-width: 1100px; line-height: 1.35; }
.back { display: inline-block; margin-bottom: 12px; padding: 8px 14px; background: #fff; border: 1px solid #ccc; border-radius: 6px; color: #6a1b9a; text-decoration: none; font-weight: 600; font-size: 14px; }
.back:hover { background: #f3e5f5; }
.wrap { display: flex; gap: 16px; flex-wrap: nowrap; align-items: flex-start; width: 100%; }
canvas { flex: 1 1 0; width: 100%; min-width: 0; background: #fff; border: 1px solid #ccc; border-radius: 6px; cursor: grab; }
.panel { flex: 0 0 250px; width: 250px; box-sizing: border-box; background: #fff; border: 1px solid #ccc; border-radius: 6px; padding: 12px 16px; }
.panel label { display: block; margin-top: 10px; font-weight: 600; font-size: 14px; }
.panel input[type=range], .panel input[type=number] { width: 100%; }
.panel button { margin-top: 10px; padding: 8px 12px; cursor: pointer; }
.result { margin-top: 14px; line-height: 1.7; font-size: 14px; }
.result b { color: #6a1b9a; }
.note { font-size: 13px; color: #555; margin-top: 12px; }
</style>
</head>
<body>
<a class="back" href="index.html">← Quay lại</a>
<h1>Bài 2. Gương phẳng và hai điểm A, B — vùng nhìn thấy ảnh của nhau</h1>
<div class="wrap">
  <canvas id="cv" width="1000" height="560"></canvas>
  <div class="panel">

    <p class="note">Kéo gương / A / B trên toàn canvas. Đường gióng AP, BH nét đứt. Vùng tím: nơi hai điểm có thể thấy ảnh của nhau.</p>

    <div class="result" id="result"></div>
    <p class="note" id="note"></p>
  </div>
</div>
<script>

const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
function clear() { ctx.clearRect(0, 0, W, H); }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function mouse(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
function line(a, b, { color = '#333', width = 2, dash = [] } = {}) {
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); ctx.restore();
}
function fillCircle(p, r, color) {
  ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill();
}
function label(t, p, color = '#222', ox = 8, oy = -8) {
  ctx.fillStyle = color; ctx.font = '14px system-ui'; ctx.fillText(t, p.x + ox, p.y + oy);
}
function arrow(a, b, color) {
  line(a, b, { color, width: 2 });
  const ang = Math.atan2(b.y - a.y, b.x - a.x);
  ctx.save(); ctx.fillStyle = color; ctx.beginPath();
  ctx.moveTo(b.x, b.y);
  ctx.lineTo(b.x - 10 * Math.cos(ang - 0.4), b.y - 10 * Math.sin(ang - 0.4));
  ctx.lineTo(b.x - 10 * Math.cos(ang + 0.4), b.y - 10 * Math.sin(ang + 0.4));
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function reflect(dir, normal) {
  const n = Math.hypot(normal.x, normal.y) || 1;
  const nx = normal.x / n, ny = normal.y / n;
  const d = 2 * (dir.x * nx + dir.y * ny);
  return { x: dir.x - d * nx, y: dir.y - d * ny };
}
function normalize(v) {
  const n = Math.hypot(v.x, v.y) || 1;
  return { x: v.x / n, y: v.y / n };
}
function toDeg(r) { return r * 180 / Math.PI; }
function toRad(d) { return d * Math.PI / 180; }
let drag = null;
canvas.addEventListener('mousedown', (e) => { drag = hitTest(mouse(e)); });
window.addEventListener('mouseup', () => { drag = null; });
canvas.addEventListener('mousemove', (e) => {
  if (!drag) return;
  onDrag(drag, mouse(e));
  render();
});


const state = {
  mirror: { x: W / 2, y: 120, len: 280 },
  A: { x: 220, y: 180 },
  B: { x: 360, y: 320 },
};
function mirrorEnds() {
  const m = state.mirror;

  return { top: { x: m.x, y: m.y }, bot: { x: m.x, y: m.y + m.len } };
}
function imageOf(p) {
  return { x: 2 * state.mirror.x - p.x, y: p.y };
}
function canSeeEachOther() {
  const Bp = imageOf(state.B);
  const m = mirrorEnds();
  const t = (state.mirror.x - state.A.x) / (Bp.x - state.A.x || 1e-9);
  const hitY = state.A.y + t * (Bp.y - state.A.y);

  return t > 0 && t < 1 && hitY >= m.top.y && hitY <= m.bot.y;
}
function clampInCanvas(q) {
  return { x: clamp(q.x, 20, W - 20), y: clamp(q.y, 20, H - 20) };
}
function hitTest(p) {
  if (dist(p, state.A) < 12) {
    return 'A';
  }

  if (dist(p, state.B) < 12) {
    return 'B';
  }

  const m = mirrorEnds();

  if (Math.abs(p.x - state.mirror.x) < 10 && p.y >= m.top.y && p.y <= m.bot.y) {
    return 'mirror';
  }

  return null;
}
function onDrag(which, p) {
  if (which === 'A') {
    state.A = clampInCanvas(p);
  }

  if (which === 'B') {
    state.B = clampInCanvas(p);
  }

  if (which === 'mirror') {
    state.mirror.x = clamp(p.x, 80, W - 80);
    state.mirror.y = clamp(p.y - state.mirror.len / 2, 20, H - state.mirror.len - 20);
  }
}
function render() {
  clear();
  const m = mirrorEnds();
  ctx.beginPath();
  ctx.moveTo(m.top.x, m.top.y);
  ctx.lineTo(m.bot.x, m.bot.y);
  ctx.lineTo(20, H - 20);
  ctx.lineTo(20, 20);
  ctx.closePath();
  ctx.fillStyle = 'rgba(106,27,154,0.10)';
  ctx.fill();
  line(m.top, m.bot, { color: '#1565c0', width: 4 });
  label('Gương', m.top, '#1565c0', 8, 14);
  const P = { x: state.mirror.x, y: state.A.y };
  const Hpt = { x: state.mirror.x, y: state.B.y };
  line(state.A, P, { color: '#555', width: 1.5, dash: [5, 4] });
  line(state.B, Hpt, { color: '#555', width: 1.5, dash: [5, 4] });
  label('P', P, '#555');
  label('H', Hpt, '#555');
  line({ x: state.A.x, y: 20 }, { x: state.A.x, y: H - 20 }, { color: '#ccc', width: 1, dash: [3, 3] });
  line({ x: state.B.x, y: 20 }, { x: state.B.x, y: H - 20 }, { color: '#ccc', width: 1, dash: [3, 3] });
  const Ai = imageOf(state.A);
  const Bi = imageOf(state.B);
  fillCircle(Ai, 5, '#6a1b9a');
  fillCircle(Bi, 5, '#6a1b9a');
  label("A'", Ai, '#6a1b9a');
  label("B'", Bi, '#6a1b9a');
  line(state.A, Bi, { color: '#2e7d32', width: 1.5, dash: [4, 4] });
  line(state.B, Ai, { color: '#2e7d32', width: 1.5, dash: [4, 4] });
  fillCircle(state.A, 7, '#e53935');
  fillCircle(state.B, 7, '#ef6c00');
  label('A', state.A);
  label('B', state.B);
  document.getElementById('result').innerHTML = canSeeEachOther()
    ? '<b>A và B nhìn thấy ảnh của nhau</b> qua gương.'
    : 'A và B <b>chưa</b> nhìn thấy ảnh của nhau — điều chỉnh vị trí.';
}

render();
</script>
<script src="../canvas-hidpi.js"></script>
</body>
</html>
