<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>Bài 7. Đường đi tia sáng từ A đến B qua 2 gương kề nhau</title>
<style>
body { font-family: system-ui, sans-serif; margin: 16px; background: #f5f6fa; color: #222; }
h1 { font-size: 18px; margin: 0 0 12px; max-width: 1100px; line-height: 1.35; }
.back { display: inline-block; margin-bottom: 12px; padding: 8px 14px; background: #fff; border: 1px solid #ccc; border-radius: 6px; color: #6a1b9a; text-decoration: none; font-weight: 600; font-size: 14px; }
.back:hover { background: #f3e5f5; }
.wrap { display: flex; gap: 16px; flex-wrap: nowrap; align-items: flex-start; width: 100%; }
canvas { flex: 1 1 0; width: 100%; min-width: 0; background: #fff; border: 1px solid #ccc; border-radius: 6px; cursor: grab; }
.panel { flex: 0 0 250px; width: 250px; box-sizing: border-box; background: #fff; border: 1px solid #ccc; border-radius: 6px; padding: 12px 16px; }
.panel label { display: block; margin-top: 10px; font-weight: 600; font-size: 14px; }
.panel input[type=range], .panel input[type=number] { width: 100%; }
.panel button { margin-top: 10px; padding: 8px 12px; cursor: pointer; }
.result { margin-top: 14px; line-height: 1.7; font-size: 14px; }
.result b { color: #6a1b9a; }
.note { font-size: 13px; color: #555; margin-top: 12px; }
</style>
</head>
<body>
<a class="back" href="index.html">← Quay lại</a>
<h1>Bài 7. Đường đi tia sáng từ A đến B qua 2 gương kề nhau</h1>
<div class="wrap">
  <canvas id="cv" width="1000" height="560"></canvas>
  <div class="panel">

    <label>Góc α = ∠G₁OG₂ = <span id="aVal"></span>°</label>
    <input id="alpha" type="range" min="20" max="160" step="1" value="90" />
    <p class="note">α là góc tạo bởi hai gương OG₁ và OG₂ tại O. Kéo A và B.</p>

    <div class="result" id="result"></div>
    <p class="note" id="note"></p>
  </div>
</div>
<script>

const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
function clear() { ctx.clearRect(0, 0, W, H); }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function mouse(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
function line(a, b, { color = '#333', width = 2, dash = [] } = {}) {
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); ctx.restore();
}
function fillCircle(p, r, color) {
  ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill();
}
function label(t, p, color = '#222', ox = 8, oy = -8) {
  ctx.fillStyle = color; ctx.font = '14px system-ui'; ctx.fillText(t, p.x + ox, p.y + oy);
}
function arrow(a, b, color) {
  line(a, b, { color, width: 2 });
  const ang = Math.atan2(b.y - a.y, b.x - a.x);
  ctx.save(); ctx.fillStyle = color; ctx.beginPath();
  ctx.moveTo(b.x, b.y);
  ctx.lineTo(b.x - 10 * Math.cos(ang - 0.4), b.y - 10 * Math.sin(ang - 0.4));
  ctx.lineTo(b.x - 10 * Math.cos(ang + 0.4), b.y - 10 * Math.sin(ang + 0.4));
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function reflect(dir, normal) {
  const n = Math.hypot(normal.x, normal.y) || 1;
  const nx = normal.x / n, ny = normal.y / n;
  const d = 2 * (dir.x * nx + dir.y * ny);
  return { x: dir.x - d * nx, y: dir.y - d * ny };
}
function normalize(v) {
  const n = Math.hypot(v.x, v.y) || 1;
  return { x: v.x / n, y: v.y / n };
}
function toDeg(r) { return r * 180 / Math.PI; }
function toRad(d) { return d * Math.PI / 180; }
let drag = null;
canvas.addEventListener('mousedown', (e) => { drag = hitTest(mouse(e)); });
window.addEventListener('mouseup', () => { drag = null; });
canvas.addEventListener('mousemove', (e) => {
  if (!drag) return;
  onDrag(drag, mouse(e));
  render();
});


const O = { x: W / 2, y: H - 80 };
const state = { alpha: 90, A: { x: 280, y: 200 }, B: { x: 720, y: 220 } };
document.getElementById('alpha').oninput = () => render();

/** Hai gương OG₁, OG₂ xuất phát từ O; góc ∠G₁OG₂ = α (vùng chứa A, B). */
function mirrors() {
  const half = toRad(state.alpha) / 2;
  const len = 300;
  // Đối xứng qua phương thẳng đứng: OG₁ lệch −α/2, OG₂ lệch +α/2
  const g1 = {
    x: O.x - len * Math.sin(half),
    y: O.y - len * Math.cos(half),
  };
  const g2 = {
    x: O.x + len * Math.sin(half),
    y: O.y - len * Math.cos(half),
  };

  return [
    { a: { ...O }, b: g1, label: 'G₁' },
    { a: { ...O }, b: g2, label: 'G₂' },
  ];
}

function hitTest(p) {
  if (dist(p, state.A) < 12) {
    return 'A';
  }

  if (dist(p, state.B) < 12) {
    return 'B';
  }

  return null;
}

function onDrag(which, p) {
  const q = { x: clamp(p.x, 40, W - 40), y: clamp(p.y, 40, O.y - 20) };

  if (which === 'A') {
    state.A = q;
  }

  if (which === 'B') {
    state.B = q;
  }
}

function reflectPoint(p, m) {
  const ax = m.b.x - m.a.x;
  const ay = m.b.y - m.a.y;
  const t = ((p.x - m.a.x) * ax + (p.y - m.a.y) * ay) / (ax * ax + ay * ay || 1);
  const proj = { x: m.a.x + t * ax, y: m.a.y + t * ay };

  return { x: 2 * proj.x - p.x, y: 2 * proj.y - p.y };
}

function segHit(p1, p2, m) {
  const x1 = p1.x;
  const y1 = p1.y;
  const x2 = p2.x;
  const y2 = p2.y;
  const x3 = m.a.x;
  const y3 = m.a.y;
  const x4 = m.b.x;
  const y4 = m.b.y;
  const d = (x1 - x2) * (y3 - y4) - (y1 - y2) * (x3 - x4);

  if (Math.abs(d) < 1e-9) {
    return null;
  }

  const t = ((x1 - x3) * (y3 - y4) - (y1 - y3) * (x3 - x4)) / d;
  const u = ((x1 - x3) * (y1 - y2) - (y1 - y3) * (x1 - x2)) / d;

  if (t < 0 || t > 1 || u < 0 || u > 1) {
    return null;
  }

  return { x: x1 + t * (x2 - x1), y: y1 + t * (y2 - y1) };
}

function drawAngleArc(alphaDeg) {
  const half = toRad(alphaDeg) / 2;
  const r = 48;
  // Cung góc trong vùng giữa OG₁ và OG₂ (phía trên O)
  const start = -Math.PI / 2 - half;
  const end = -Math.PI / 2 + half;
  ctx.beginPath();
  ctx.arc(O.x, O.y, r, start, end);
  ctx.strokeStyle = '#6a1b9a';
  ctx.lineWidth = 2;
  ctx.stroke();
  const mid = -Math.PI / 2;
  label('α', {
    x: O.x + (r + 14) * Math.cos(mid),
    y: O.y + (r + 14) * Math.sin(mid),
  }, '#6a1b9a', -4, 4);
}

function measuredAngle(ms) {
  const v1 = { x: ms[0].b.x - O.x, y: ms[0].b.y - O.y };
  const v2 = { x: ms[1].b.x - O.x, y: ms[1].b.y - O.y };
  const cos = (v1.x * v2.x + v1.y * v2.y) / ((Math.hypot(v1.x, v1.y) * Math.hypot(v2.x, v2.y)) || 1);

  return toDeg(Math.acos(clamp(cos, -1, 1)));
}

function render() {
  clear();
  state.alpha = +document.getElementById('alpha').value;
  document.getElementById('aVal').textContent = state.alpha;
  const ms = mirrors();

  ms.forEach((m) => {
    line(m.a, m.b, { color: '#1565c0', width: 5 });
    label(m.label, m.b, '#1565c0', m.label === 'G₁' ? -28 : 8, 0);
  });
  drawAngleArc(state.alpha);
  fillCircle(O, 5, '#000');
  label('O', O, '#000', -6, 20);
  label('OG₁', { x: (O.x + ms[0].b.x) / 2, y: (O.y + ms[0].b.y) / 2 }, '#1565c0', -40, -8);
  label('OG₂', { x: (O.x + ms[1].b.x) / 2, y: (O.y + ms[1].b.y) / 2 }, '#1565c0', 8, -8);

  const B1 = reflectPoint(state.B, ms[1]);
  const B2 = reflectPoint(B1, ms[0]);
  line(state.A, B2, { color: '#ccc', width: 1, dash: [4, 4] });
  const h1 = segHit(state.A, B2, ms[0]);
  let h2 = null;

  if (h1) {
    h2 = segHit(h1, B1, ms[1]);
  }

  if (h1 && h2) {
    arrow(state.A, h1, '#e53935');
    arrow(h1, h2, '#ef6c00');
    arrow(h2, state.B, '#2e7d32');
    fillCircle(h1, 5, '#e53935');
    fillCircle(h2, 5, '#ef6c00');
  } else {
    line(state.A, state.B, { color: '#999', width: 1, dash: [4, 4] });
  }

  fillCircle(state.A, 7, '#e53935');
  fillCircle(state.B, 7, '#2e7d32');
  label('A', state.A);
  label('B', state.B, '#2e7d32');

  const ang = measuredAngle(ms);
  document.getElementById('result').innerHTML =
    `Góc tạo bởi hai gương: <b>∠G₁OG₂ = α = ${ang.toFixed(1)}°</b><br>`
    + (h1 && h2
      ? '<b>Đường đi A → OG₁ → OG₂ → B</b> (phương pháp ảnh).'
      : 'Không tìm được đường phản xạ tới B — hãy đổi A, B hoặc α.');
}

render();
</script>
<script src="../canvas-hidpi.js"></script>
</body>
</html>
