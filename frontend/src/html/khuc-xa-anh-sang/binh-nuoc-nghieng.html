<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Bài 11. Khúc xạ qua bình nước nghiêng</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        font-family: system-ui, sans-serif;
        background: #f5f6fa;
        color: #222;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
        padding: 12px 16px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
        line-height: 1.35;
        flex: 0 0 auto;
      }
      .back {
        display: inline-block;
        margin-bottom: 8px;
        padding: 8px 14px;
        background: #fff;
        border: 1px solid #ccc;
        border-radius: 6px;
        color: #6a1b9a;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        flex: 0 0 auto;
        align-self: flex-start;
      }
      .back:hover {
        background: #f3e5f5;
      }
      .wrap {
        flex: 1 1 auto;
        display: flex;
        gap: 12px;
        min-height: 0;
        align-items: stretch;
      }
      canvas {
        flex: 1 1 auto;
        width: 100%;
        height: 100%;
        min-width: 0;
        background: #fff;
        border: 1px solid #ccc;
        border-radius: 6px;
        cursor: grab;
      }
      .panel {
        flex: 0 0 250px;
        width: 250px;
        box-sizing: border-box;
        background: #fff;
        border: 1px solid #ccc;
        border-radius: 6px;
        padding: 12px 16px;
        overflow: auto;
      }
      .panel label {
        display: block;
        margin-top: 10px;
        font-weight: 600;
        font-size: 14px;
      }
      .panel input[type='range'] {
        width: 100%;
      }
      .result {
        margin-top: 14px;
        line-height: 1.7;
        font-size: 14px;
      }
      .result b {
        color: #6a1b9a;
      }
      .note {
        font-size: 13px;
        color: #555;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <a class="back" href="index.html">← Quay lại</a>
    <h1>Bài 11. Khúc xạ qua bình nước nghiêng (2 lần: không khí ↔ nước)</h1>
    <div class="wrap">
      <canvas id="cv"></canvas>
      <div class="panel">
        <label>Góc nghiêng bình φ = <span id="phiVal"></span>°</label>
        <input id="phi" type="range" min="-40" max="40" step="0.1" value="0" />
        <label>Góc tia tới so với ngang α = <span id="alphaVal"></span>°</label>
        <input id="alpha" type="range" min="-90" max="90" step="0.1" value="-45" />
        <label>Chiết suất nước n = <span id="nVal"></span></label>
        <input id="nWater" type="range" min="1.1" max="1.8" step="0.01" value="1.33" />
        <p class="note">Bình xoay theo φ (đáy nghiêng). Mặt nước trên cùng luôn ngang. Kéo <b>S</b> để đổi vị trí.</p>
        <div class="result" id="result"></div>
        <p class="note" id="note"></p>
      </div>
    </div>
    <script>
      const canvas = document.getElementById('cv');
      const ctx = canvas.getContext('2d');
      const N_AIR = 1;
      const viewport = { width: 0, height: 0 };

      function clear() {
        ctx.clearRect(0, 0, viewport.width, viewport.height);
      }
      function dist(a, b) {
        return Math.hypot(a.x - b.x, a.y - b.y);
      }
      function clamp(v, a, b) {
        return Math.max(a, Math.min(b, v));
      }
      function toDeg(r) {
        return (r * 180) / Math.PI;
      }
      function toRad(d) {
        return (d * Math.PI) / 180;
      }
      function normalize(v) {
        const n = Math.hypot(v.x, v.y) || 1;

        return { x: v.x / n, y: v.y / n };
      }
      function dot(a, b) {
        return a.x * b.x + a.y * b.y;
      }
      function add(a, b) {
        return { x: a.x + b.x, y: a.y + b.y };
      }
      function scale(v, s) {
        return { x: v.x * s, y: v.y * s };
      }
      function sub(a, b) {
        return { x: a.x - b.x, y: a.y - b.y };
      }

      function line(a, b, { color = '#333', width = 2, dash = [] } = {}) {
        ctx.save();
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.setLineDash(dash);
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
        ctx.restore();
      }
      function fillCircle(p, r, color) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
      }
      function label(t, p, color = '#222', ox = 8, oy = -8) {
        ctx.fillStyle = color;
        ctx.font = '14px system-ui';
        ctx.fillText(t, p.x + ox, p.y + oy);
      }
      function arrow(a, b, color, width = 2.5) {
        line(a, b, { color, width });
        const ang = Math.atan2(b.y - a.y, b.x - a.x);
        ctx.save();
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(b.x, b.y);
        ctx.lineTo(b.x - 10 * Math.cos(ang - 0.4), b.y - 10 * Math.sin(ang - 0.4));
        ctx.lineTo(b.x - 10 * Math.cos(ang + 0.4), b.y - 10 * Math.sin(ang + 0.4));
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function mouse(e) {
        const r = canvas.getBoundingClientRect();

        return {
          x: ((e.clientX - r.left) * viewport.width) / r.width,
          y: ((e.clientY - r.top) * viewport.height) / r.height,
        };
      }

      /** dir: hướng tia; normalOut: pháp tuyến ra ngoài bình */
      function snellAngles(dir, normalOut, n1, n2) {
        let n = normalize(normalOut);
        const d = normalize(dir);

        if (dot(d, n) > 0) {
          n = { x: -n.x, y: -n.y };
        }

        const cosi = clamp(-dot(d, n), -1, 1);
        const i = Math.acos(cosi);
        const sinr = (n1 / n2) * Math.sin(i);

        if (Math.abs(sinr) > 1) {
          return { i, r: null, dir: null };
        }

        const r = Math.asin(sinr);
        const eta = n1 / n2;
        const k = 1 - eta * eta * (1 - cosi * cosi);
        const out = normalize({
          x: eta * d.x + (eta * cosi - Math.sqrt(k)) * n.x,
          y: eta * d.y + (eta * cosi - Math.sqrt(k)) * n.y,
        });

        return { i, r, dir: out };
      }

      function rotatePoint(p, c, th) {
        const dx = p.x - c.x;
        const dy = p.y - c.y;

        return {
          x: c.x + dx * Math.cos(th) - dy * Math.sin(th),
          y: c.y + dx * Math.sin(th) + dy * Math.cos(th),
        };
      }

      function intersectHorizontal(a, b, yLine) {
        const t = (yLine - a.y) / (b.y - a.y || 1e-12);

        return { x: a.x + t * (b.x - a.x), y: yLine };
      }

      /** Cắt đa giác: giữ phần y ≥ yLine (dưới mặt nước trên canvas). */
      function clipBelowHorizontal(poly, yLine) {
        if (!poly.length) {
          return [];
        }

        const out = [];

        for (let i = 0; i < poly.length; i++) {
          const cur = poly[i];
          const prev = poly[(i + poly.length - 1) % poly.length];
          const curIn = cur.y >= yLine - 1e-9;
          const prevIn = prev.y >= yLine - 1e-9;

          if (curIn) {
            if (!prevIn) {
              out.push(intersectHorizontal(prev, cur, yLine));
            }

            out.push(cur);
          } else if (prevIn) {
            out.push(intersectHorizontal(prev, cur, yLine));
          }
        }

        return out;
      }

      function polygonCentroid(poly) {
        let x = 0;
        let y = 0;

        for (const p of poly) {
          x += p.x;
          y += p.y;
        }

        const n = poly.length || 1;

        return { x: x / n, y: y / n };
      }

      function edgesFromPolygon(corners) {
        const c = polygonCentroid(corners);
        const edges = [];

        for (let i = 0; i < corners.length; i++) {
          const a = corners[i];
          const b = corners[(i + 1) % corners.length];
          const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
          const edgeDirection = sub(b, a);
          let outward = normalize({ x: edgeDirection.y, y: -edgeDirection.x });

          // Pháp tuyến phải vuông góc với cạnh và hướng ra ngoài khối nước.
          if (dot(outward, sub(c, mid)) > 0) {
            outward = { x: -outward.x, y: -outward.y };
          }

          edges.push({
            a,
            b,
            outward,
            index: i,
            isHorizontal: Math.abs(edgeDirection.y) < 1e-6,
          });
        }

        return edges;
      }

      /**
       * Bình thủy tinh = hình chữ nhật xoay góc φ (đáy nghiêng theo).
       * Nước = phần bình nằm dưới mặt nước ngang (y = waterY).
       */
      function getTank(cx, cy, bw, bh, phi) {
        const local = [
          { x: cx - bw / 2, y: cy - bh / 2 },
          { x: cx + bw / 2, y: cy - bh / 2 },
          { x: cx + bw / 2, y: cy + bh / 2 },
          { x: cx - bw / 2, y: cy + bh / 2 },
        ];
        const glass = local.map((p) => rotatePoint(p, { x: cx, y: cy }, phi));
        // Mặt nước ngang gần phần trên bình (khi φ = 0)
        const waterY = cy - bh * 0.18;
        const water = clipBelowHorizontal(glass, waterY);
        const edges = edgesFromPolygon(water);

        return { glass, water, edges, waterY, cx, cy, bw, bh, phi };
      }

      function raySegmentHit(origin, dir, a, b) {
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const det = dir.x * dy - dir.y * dx;

        if (Math.abs(det) < 1e-9) {
          return null;
        }

        const ox = a.x - origin.x;
        const oy = a.y - origin.y;
        const t = (ox * dy - oy * dx) / det;
        const u = (ox * dir.y - oy * dir.x) / det;

        if (t > 1e-6 && u >= -1e-6 && u <= 1 + 1e-6) {
          return {
            t,
            point: { x: origin.x + dir.x * t, y: origin.y + dir.y * t },
            u,
          };
        }

        return null;
      }

      function findHit(origin, dir, edges, { excludeIndex = -1, maxT = Infinity } = {}) {
        let best = null;

        for (const edge of edges) {
          if (edge.index === excludeIndex) {
            continue;
          }

          const hit = raySegmentHit(origin, dir, edge.a, edge.b);

          if (hit && hit.t < maxT && (!best || hit.t < best.t)) {
            best = { ...hit, edge };
          }
        }

        return best;
      }

      function drawNormal(p, n, len = 36) {
        const tip = add(p, scale(n, len));
        line(p, tip, { color: '#9e9e9e', width: 1.5, dash: [3, 3] });
      }

      function getAngleBetween(dir1, dir2) {
        const a = normalize(dir1);
        const b = normalize(dir2);

        return Math.acos(clamp(dot(a, b), -1, 1));
      }

      function drawAngleBetween(center, dir1, dir2, text, color, radius) {
        const a = normalize(dir1);
        const b = normalize(dir2);
        const start = Math.atan2(a.y, a.x);
        const delta = Math.atan2(a.x * b.y - a.y * b.x, dot(a, b));
        const end = start + delta;
        const middle = start + delta / 2;

        ctx.save();
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(center.x, center.y, radius, start, end, delta < 0);
        ctx.stroke();
        ctx.restore();
        label(
          text,
          {
            x: center.x + Math.cos(middle) * (radius + 8),
            y: center.y + Math.sin(middle) * (radius + 8),
          },
          color,
          0,
          0,
        );
      }

      const state = { S: null };
      let drag = null;

      canvas.addEventListener('mousedown', (e) => {
        const p = mouse(e);

        if (state.S && dist(p, state.S) < 16) {
          drag = 'S';
        }
      });
      window.addEventListener('mouseup', () => {
        drag = null;
      });
      canvas.addEventListener('mousemove', (e) => {
        const p = mouse(e);
        const W = viewport.width;
        const H = viewport.height;

        if (drag === 'S') {
          state.S = {
            x: clamp(p.x, 20, W - 20),
            y: clamp(p.y, 20, H - 20),
          };
          render();

          return;
        }

        canvas.style.cursor = state.S && dist(p, state.S) < 16 ? 'grab' : 'default';
      });

      ['phi', 'alpha', 'nWater'].forEach((id) => {
        document.getElementById(id).oninput = () => render();
      });
      window.addEventListener('resize', resize);

      function resize() {
        const rect = canvas.getBoundingClientRect();
        const pixelRatio = Math.max(1, window.devicePixelRatio || 1);
        viewport.width = Math.max(400, Math.floor(rect.width));
        viewport.height = Math.max(300, Math.floor(rect.height));
        canvas.width = Math.round(viewport.width * pixelRatio);
        canvas.height = Math.round(viewport.height * pixelRatio);
        ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

        if (!state.S) {
          state.S = { x: viewport.width * 0.08, y: viewport.height * 0.12 };
        } else {
          state.S.x = clamp(state.S.x, 20, viewport.width - 20);
          state.S.y = clamp(state.S.y, 20, viewport.height - 20);
        }

        render();
      }

      function render() {
        const W = viewport.width;
        const H = viewport.height;

        if (!W || !H || !state.S) {
          return;
        }

        clear();

        const phiDeg = +document.getElementById('phi').value;
        const alphaDeg = +document.getElementById('alpha').value;
        const nWater = +document.getElementById('nWater').value;
        document.getElementById('phiVal').textContent = phiDeg.toFixed(1);
        document.getElementById('alphaVal').textContent = alphaDeg.toFixed(1);
        document.getElementById('nVal').textContent = nWater.toFixed(2);

        const cx = W * 0.52;
        const cy = H * 0.5;
        const bw = Math.min(W * 0.38, 320);
        const bh = Math.min(H * 0.48, 240);
        const phi = toRad(phiDeg);
        const tank = getTank(cx, cy, bw, bh, phi);

        // Vỏ bình thủy tinh (hình chữ nhật nghiêng)
        ctx.save();
        ctx.beginPath();
        tank.glass.forEach((p, i) => (i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y)));
        ctx.closePath();
        ctx.strokeStyle = '#90a4ae';
        ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.restore();

        // Khối nước: đáy/thành theo bình nghiêng, mặt trên luôn ngang
        if (tank.water.length >= 3) {
          ctx.save();
          ctx.beginPath();
          tank.water.forEach((p, i) => (i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y)));
          ctx.closePath();
          ctx.fillStyle = 'rgba(30, 136, 229, 0.28)';
          ctx.fill();
          ctx.strokeStyle = '#1565c0';
          ctx.lineWidth = 2.5;
          ctx.stroke();
          ctx.restore();
        }

        // Mặt nước ngang (nhấn mạnh)
        const waterXs = tank.water.filter((p) => Math.abs(p.y - tank.waterY) < 1.5).map((p) => p.x);
        if (waterXs.length >= 2) {
          const xMin = Math.min(...waterXs);
          const xMax = Math.max(...waterXs);
          line({ x: xMin, y: tank.waterY }, { x: xMax, y: tank.waterY }, { color: '#0277bd', width: 3 });
          label('Mặt nước', { x: xMax, y: tank.waterY }, '#0277bd', 8, -6);
        }

        const waterLabel = polygonCentroid(tank.water.length ? tank.water : [{ x: cx, y: cy }]);
        label('Nước n = ' + nWater.toFixed(2), waterLabel, '#1565c0', -40, 6);

        line({ x: 16, y: H / 2 }, { x: W - 16, y: H / 2 }, { color: '#bbb', width: 1, dash: [6, 5] });
        label('Ngang', { x: W - 70, y: H / 2 }, '#999', 0, -8);

        const alpha = toRad(alphaDeg);
        const incDir = normalize({ x: Math.cos(alpha), y: -Math.sin(alpha) });

        fillCircle(state.S, 9, '#ffeb3b');
        ctx.beginPath();
        ctx.arc(state.S.x, state.S.y, 9, 0, Math.PI * 2);
        ctx.strokeStyle = '#f9a825';
        ctx.lineWidth = 2;
        ctx.stroke();
        label('S', state.S, '#f57f17', 12, -8);

        let html = '';
        let note = 'Bình nghiêng φ (đáy theo bình). Mặt nước trên cùng luôn ngang. Khúc xạ 2 lần: KK→nước→KK.';

        if (tank.water.length < 3 || !tank.edges.length) {
          const far = add(state.S, scale(incDir, Math.hypot(W, H)));
          arrow(state.S, far, '#e53935');
          html = 'Không còn nước trong bình (φ quá lớn). Giảm góc nghiêng.';
          document.getElementById('result').innerHTML = html;
          document.getElementById('note').textContent = note;

          return;
        }

        // Tia tới cắt biên khối nước
        const hit1 = findHit(state.S, incDir, tank.edges);

        if (!hit1) {
          const far = add(state.S, scale(incDir, Math.hypot(W, H)));
          arrow(state.S, far, '#e53935');
          html = 'Tia từ <b>S</b> không cắt khối nước. Hãy kéo S hoặc đổi α / φ.';
          document.getElementById('result').innerHTML = html;
          document.getElementById('note').textContent = note;

          return;
        }

        const I = hit1.point;
        arrow(state.S, I, '#e53935');
        drawNormal(I, hit1.edge.outward);

        // Khúc xạ 1: không khí → nước
        const ref1 = snellAngles(incDir, hit1.edge.outward, N_AIR, nWater);

        if (!ref1.dir) {
          fillCircle(I, 4, '#000');
          label('I', I);
          html = `Tại <b>I</b>: không khúc xạ vào nước (i₁ = <b>${toDeg(ref1.i).toFixed(1)}°</b>).`;
          document.getElementById('result').innerHTML = html;
          document.getElementById('note').textContent = note;

          return;
        }

        const firstDeviation = getAngleBetween(incDir, ref1.dir);

        // Trong nước: tìm mặt ra
        const hit2 = findHit(I, ref1.dir, tank.edges, { excludeIndex: hit1.edge.index });

        if (!hit2) {
          arrow(I, add(I, scale(ref1.dir, 160)), '#1565c0');
          fillCircle(I, 4, '#000');
          label('I', I);
          html =
            `Khúc xạ 1 (KK→nước) tại <b>I</b>: i₁ = <b>${toDeg(ref1.i).toFixed(1)}°</b>, r₁ = <b>${toDeg(
              ref1.r,
            ).toFixed(1)}°</b>.<br>` + 'Không tìm thấy mặt ra — thử đổi vị trí S.';
          document.getElementById('result').innerHTML = html;
          document.getElementById('note').textContent = note;

          return;
        }

        const J = hit2.point;
        arrow(I, J, '#1565c0');
        drawNormal(J, hit2.edge.outward);
        line(I, add(I, scale(incDir, 90)), { color: '#e53935', width: 1, dash: [5, 4] });
        drawAngleBetween(
          I,
          incDir,
          ref1.dir,
          `Δ₁=${toDeg(firstDeviation).toFixed(1)}°`,
          '#0d47a1',
          30,
        );

        // Khúc xạ 2: nước → không khí
        const ref2 = snellAngles(ref1.dir, hit2.edge.outward, nWater, N_AIR);

        fillCircle(I, 4, '#000');
        fillCircle(J, 4, '#000');
        label('I', I);
        label('J', J);

        if (!ref2.dir) {
          // Phản xạ toàn phần tại J (nước → KK)
          let nn = normalize(hit2.edge.outward);

          if (dot(ref1.dir, nn) > 0) {
            nn = { x: -nn.x, y: -nn.y };
          }

          const refl = normalize({
            x: ref1.dir.x - 2 * dot(ref1.dir, nn) * nn.x,
            y: ref1.dir.y - 2 * dot(ref1.dir, nn) * nn.y,
          });
          arrow(J, add(J, scale(refl, 100)), '#6a1b9a');
          html =
            `Khúc xạ 1 tại <b>I</b>: i₁ = <b>${toDeg(ref1.i).toFixed(1)}°</b>, r₁ = <b>${toDeg(ref1.r).toFixed(
              1,
            )}°</b>.<br>` +
            `Góc lệch Δ₁ so với tia tới = <b>${toDeg(firstDeviation).toFixed(1)}°</b>.<br>` +
            `Tại <b>J</b>: <b>phản xạ toàn phần</b> (i₂ = ${toDeg(ref2.i).toFixed(1)}° &gt; i<sub>gh</sub>).`;
          document.getElementById('result').innerHTML = html;
          document.getElementById('note').textContent = note;

          return;
        }

        const outEnd = add(J, scale(ref2.dir, 180));
        arrow(J, outEnd, '#2e7d32');
        const secondDeviation = getAngleBetween(incDir, ref2.dir);
        line(add(J, scale(incDir, -55)), add(J, scale(incDir, 90)), {
          color: '#e53935',
          width: 1,
          dash: [5, 4],
        });
        drawAngleBetween(
          J,
          incDir,
          ref2.dir,
          `Δ₂=${toDeg(secondDeviation).toFixed(1)}°`,
          '#2e7d32',
          38,
        );

        // Góc lệch D giữa hướng tới và hướng ló
        const angIn = Math.atan2(-incDir.y, incDir.x);
        const angOut = Math.atan2(-ref2.dir.y, ref2.dir.x);
        let D = toDeg(angOut - angIn);

        while (D > 180) {
          D -= 360;
        }

        while (D < -180) {
          D += 360;
        }

        html =
          `Khúc xạ 1 (<b>KK → nước</b>) tại I: i₁ = <b>${toDeg(ref1.i).toFixed(1)}°</b>, r₁ = <b>${toDeg(
            ref1.r,
          ).toFixed(1)}°</b>.<br>` +
          `Góc lệch Δ₁ so với tia tới = <b>${toDeg(firstDeviation).toFixed(1)}°</b>.<br>` +
          `Khúc xạ 2 (<b>nước → KK</b>) tại J: i₂ = <b>${toDeg(ref2.i).toFixed(1)}°</b>, r₂ = <b>${toDeg(
            ref2.r,
          ).toFixed(1)}°</b>.<br>` +
          `Góc lệch Δ₂ (tia ló so với tia tới) = <b>${toDeg(secondDeviation).toFixed(1)}°</b> `
          + `(D có dấu ≈ ${D.toFixed(1)}°).`;
        note =
          'Đỏ: tia tới (KK). Xanh dương: trong nước. Xanh lá: tia ló (KK). Nét xám: pháp tuyến. ' +
          'Vỏ xám = bình nghiêng; mặt nước xanh đậm luôn ngang.';

        document.getElementById('result').innerHTML = html;
        document.getElementById('note').textContent = note;
      }

      resize();
    </script>
  </body>
</html>
