<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Khúc xạ</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 16px;
        background: #f5f6fa;
        color: #222;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 12px;
      }
      .tabs {
        display: flex;
        gap: 4px;
        margin-bottom: -1px;
      }
      .tab {
        padding: 10px 20px;
        border: 1px solid #ccc;
        border-bottom: none;
        border-radius: 6px 6px 0 0;
        background: #e4e6ef;
        cursor: pointer;
        font-size: 15px;
        font-weight: 600;
        color: #555;
      }
      .tab.active {
        background: #fff;
        color: #6a1b9a;
      }
      .wrap {
        display: flex;
        gap: 16px;
        flex-wrap: nowrap;
        align-items: flex-start;
      }
      canvas {
        flex: 1 1 0;
        min-width: 0;
        width: 100%;
        height: auto;
        background: #fff;
        border: 1px solid #ccc;
        border-radius: 0 6px 6px 6px;
        cursor: grab;
      }
      .panel {
        flex: 0 0 250px;
        width: 250px;
        box-sizing: border-box;
        background: #fff;
        border: 1px solid #ccc;
        border-radius: 6px;
        padding: 12px 16px;
      }
      .panel label {
        display: block;
        margin-top: 10px;
        font-weight: 600;
      }
      .panel input[type="range"] {
        width: 100%;
      }
      .result {
        margin-top: 16px;
        line-height: 1.7;
      }
      .result b {
        color: #6a1b9a;
      }
      .legend div {
        display: flex;
        align-items: center;
        margin-top: 4px;
      }
      .legend .swatch {
        flex: 0 0 28px;
        height: 0;
        margin-right: 8px;
      }
      .note {
        font-size: 13px;
        color: #555;
        margin-top: 12px;
      }
      .back {
        display: inline-block;
        margin-bottom: 12px;
        padding: 8px 14px;
        background: #fff;
        border: 1px solid #ccc;
        border-radius: 6px;
        color: #6a1b9a;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
      }
      .back:hover {
        background: #f3e5f5;
      }
      canvas {
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <a class="back" href="index.html">← Quay lại</a>
    <h1 id="title"></h1>
    <div class="wrap">
      <canvas id="cv" width="1200" height="600"></canvas>
      <div class="panel" id="refractionPanel">
        <label>Chiết suất môi trường 1: n₁ = <span id="n1Val">1</span></label>
        <input id="n1In" type="range" min="1" max="2.5" step="0.01" value="1" />
        <label
          >Chiết suất môi trường 2: n₂ = <span id="n2Val">1.33</span></label
        >
        <input
          id="n2In"
          type="range"
          min="1"
          max="2.5"
          step="0.01"
          value="1.33"
        />
        <label>Góc tới i = <span id="refractionAngleVal"></span>°</label>
        <input
          id="refractionAngleIn"
          type="range"
          min="0"
          max="89"
          step="0.5"
          value="30"
        />
        <button id="criticalBtn" type="button" style="margin-top: 10px">
          Đặt i = i<sub>gh</sub>
        </button>

        <div class="result" id="refractionResult"></div>

        <div class="legend note">
          <div>
            <span class="swatch" style="border-top: 3px solid #e53935"></span
            >Tia tới SI
          </div>
          <div>
            <span class="swatch" style="border-top: 3px solid #2e7d32"></span
            >Tia khúc xạ IK
          </div>
          <div>
            <span class="swatch" style="border-top: 3px solid #ef6c00"></span
            >Tia phản xạ IR
          </div>
          <div>
            <span class="swatch" style="border-top: 2px dashed #555"></span>Pháp
            tuyến NN'
          </div>
        </div>
        <p class="note">Có thể kéo điểm S trên hình để thay đổi góc tới.</p>
      </div>
    </div>
    <script>
      window.OPTICS_MODE = "refraction";
    </script>
    <script src="../optics.js"></script>
  </body>
</html>
