<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>Bài 3. Cột đèn cao H chiếu vật AB cao h — độ dài bóng</title>
<style>
body { font-family: system-ui, sans-serif; margin: 16px; background: #f5f6fa; color: #222; }
h1 { font-size: 18px; margin: 0 0 12px; max-width: 1100px; line-height: 1.35; }
.back { display: inline-block; margin-bottom: 12px; padding: 8px 14px; background: #fff; border: 1px solid #ccc; border-radius: 6px; color: #6a1b9a; text-decoration: none; font-weight: 600; font-size: 14px; }
.back:hover { background: #f3e5f5; }
.wrap { display: flex; gap: 16px; flex-wrap: nowrap; align-items: flex-start; width: 100%; }
canvas { flex: 1 1 0; width: 100%; min-width: 0; background: #fff; border: 1px solid #ccc; border-radius: 6px; cursor: grab; }
.panel { flex: 0 0 250px; width: 250px; box-sizing: border-box; background: #fff; border: 1px solid #ccc; border-radius: 6px; padding: 12px 16px; }
.panel label { display: block; margin-top: 10px; font-weight: 600; font-size: 14px; }
.panel input[type=range], .panel input[type=number] { width: 100%; }
.panel button { margin-top: 10px; padding: 8px 12px; cursor: pointer; }
.result { margin-top: 14px; line-height: 1.7; font-size: 14px; }
.result b { color: #6a1b9a; }
.note { font-size: 13px; color: #555; margin-top: 12px; }
</style>
</head>
<body>
<a class="back" href="index.html">← Quay lại</a>
<h1>Bài 3. Cột đèn cao H chiếu vật AB cao h — độ dài bóng</h1>
<div class="wrap">
  <canvas id="cv" width="1000" height="560"></canvas>
  <div class="panel">

    <label>Chiều cao cột đèn H = <span id="Hv"></span></label>
    <input id="Hlamp" type="range" min="120" max="400" step="1" value="280" />
    <label>Chiều cao vật h = <span id="hv"></span></label>
    <input id="hObj" type="range" min="40" max="180" step="1" value="100" />
    <p class="note">Kéo vật AB theo phương ngang.</p>

    <div class="result" id="result"></div>
    <p class="note" id="note"></p>
  </div>
</div>
<script>

const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
function clear() { ctx.clearRect(0, 0, W, H); }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function mouse(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
function line(a, b, { color = '#333', width = 2, dash = [] } = {}) {
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); ctx.restore();
}
function fillCircle(p, r, color) {
  ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill();
}
function label(t, p, color = '#222', ox = 8, oy = -8) {
  ctx.fillStyle = color; ctx.font = '14px system-ui'; ctx.fillText(t, p.x + ox, p.y + oy);
}
function arrow(a, b, color) {
  line(a, b, { color, width: 2 });
  const ang = Math.atan2(b.y - a.y, b.x - a.x);
  ctx.save(); ctx.fillStyle = color; ctx.beginPath();
  ctx.moveTo(b.x, b.y);
  ctx.lineTo(b.x - 10 * Math.cos(ang - 0.4), b.y - 10 * Math.sin(ang - 0.4));
  ctx.lineTo(b.x - 10 * Math.cos(ang + 0.4), b.y - 10 * Math.sin(ang + 0.4));
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function reflect(dir, normal) {
  const n = Math.hypot(normal.x, normal.y) || 1;
  const nx = normal.x / n, ny = normal.y / n;
  const d = 2 * (dir.x * nx + dir.y * ny);
  return { x: dir.x - d * nx, y: dir.y - d * ny };
}
function normalize(v) {
  const n = Math.hypot(v.x, v.y) || 1;
  return { x: v.x / n, y: v.y / n };
}
function toDeg(r) { return r * 180 / Math.PI; }
function toRad(d) { return d * Math.PI / 180; }
let drag = null;
canvas.addEventListener('mousedown', (e) => { drag = hitTest(mouse(e)); });
window.addEventListener('mouseup', () => { drag = null; });
canvas.addEventListener('mousemove', (e) => {
  if (!drag) return;
  onDrag(drag, mouse(e));
  render();
});


const ground = H - 60;
const lampX = 120;
const state = { objX: 320, Hlamp: 280, h: 100 };
document.getElementById('Hlamp').oninput = document.getElementById('hObj').oninput = () => render();
function hitTest(p) {
  if (Math.abs(p.x - state.objX) < 20 && p.y > ground - state.h - 10 && p.y < ground + 10) {
    return 'obj';
  }

  return null;
}
function onDrag(which, p) {
  if (which === 'obj') {
    state.objX = clamp(p.x, lampX, W - 80);
  }
}
function render() {
  clear();
  state.Hlamp = +document.getElementById('Hlamp').value;
  state.h = +document.getElementById('hObj').value;
  document.getElementById('Hv').textContent = state.Hlamp + ' px';
  document.getElementById('hv').textContent = state.h + ' px';
  line({ x: 40, y: ground }, { x: W - 40, y: ground }, { color: '#333', width: 2 });
  const lampBase = { x: lampX, y: ground };
  const lampTop = { x: lampX, y: ground - state.Hlamp };
  line(lampBase, lampTop, { color: '#555', width: 4 });
  fillCircle(lampBase, 5, '#555');
  label('Chân đèn', lampBase, '#555', -28, 22);
  fillCircle(lampTop, 12, '#ffeb3b');
  label('Đèn', lampTop, '#f9a825', 14, 4);
  const A = { x: state.objX, y: ground };
  const B = { x: state.objX, y: ground - state.h };
  line(A, B, { color: '#ef6c00', width: 4 });
  fillCircle(A, 5, '#ef6c00');
  fillCircle(B, 5, '#ef6c00');
  label('A', A, '#ef6c00', 8, 14);
  label('B', B);
  const d = Math.max(0, state.objX - lampX);
  const denom = state.Hlamp - state.h;
  const shadowLen = denom > 0 ? d * state.h / denom : 0;
  const tip = { x: A.x + shadowLen, y: ground };

  if (shadowLen > 0.5) {
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(A.x, ground - 8, shadowLen, 8);
    arrow(lampTop, tip, '#e53935');
  }

  if (d > 0.5) {
    arrow(lampTop, A, '#e53935');
  }

  line(lampBase, A, { color: '#6a1b9a', width: 1.5, dash: [5, 4] });
  label(`d = ${d.toFixed(0)}`, { x: (lampX + state.objX) / 2, y: ground }, '#6a1b9a', -10, -10);
  document.getElementById('result').innerHTML =
    `Khoảng cách chân đèn → vật: d = <b>${d.toFixed(0)}</b> px (tối thiểu 0)<br>`
    + `Độ dài bóng L = d·h/(H−h) = <b>${shadowLen.toFixed(1)}</b> px`;
}

render();
</script>
<script src="../canvas-hidpi.js"></script>
</body>
</html>
