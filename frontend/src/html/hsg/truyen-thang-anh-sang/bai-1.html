<style>
body { font-family: system-ui, sans-serif; margin: 16px; background: #f5f6fa; color: #222; line-height: 1.55; }
.back { display: inline-block; margin-bottom: 12px; padding: 8px 14px; background: #fff; border: 1px solid #ccc; border-radius: 6px; color: #1e4a7a; text-decoration: none; font-weight: 600; font-size: 14px; }
.back:hover { background: #e8f1fb; }
h1 { font-size: 20px; margin: 0 0 8px; color: #0b1f3a; }
.meta { color: #555; font-size: 14px; margin-bottom: 16px; }
.content { max-width: 860px; background: #fff; border: 1px solid #d7dce2; border-radius: 10px; padding: 20px 22px; }
.content p { margin: 0 0 12px; }
.content img { max-width: 100%; height: auto; display: block; margin: 12px 0; border-radius: 6px; border: 1px solid #e2e6ea; }
.content table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 14px; }
.content th, .content td { border: 1px solid #ccc; padding: 8px 10px; text-align: left; vertical-align: top; }
.layout { display: grid; grid-template-columns: 1fr; gap: 16px; align-items: start; }
@media (min-width: 900px) {
  .layout { grid-template-columns: 1fr 1fr; }
}
.sim-panel { display: flex; flex-direction: column; gap: 10px; }
.sim-btn { padding: 10px 16px; border: none; border-radius: 8px; background: #1e4a7a; color: #fff; font-weight: 600; font-size: 14px; cursor: pointer; align-self: flex-start; }
.sim-btn:hover { background: #163a63; }
.sim-wrap { display: none; border: 1px solid #ccc; border-radius: 10px; overflow: hidden; background: #fff; aspect-ratio: 16 / 9; }
.sim-wrap.open { display: block; }
.sim-wrap iframe { width: 100%; height: 100%; border: 0; }
</style>
</head>

<p class="meta">Chủ đề: Truyền thẳng ánh sáng · Bài tập HSG Quang học</p>
<div class="layout">
  <div class="content">
    <p>Một người có chiều cao 1,6m, đứng ngay dưới ngọn đèn treo ở độ cao 4m. Người này bước đi đều với vận tốc v = 5,4km/h. Hãy xác định tốc độ chuyển động của bóng của đỉnh đầu in trên mặt đất.</p>
  </div>
  <div class="sim-panel">
    <button type="button" class="sim-btn" id="simBtn">Mô phỏng</button>
    <div class="sim-wrap" id="simWrap">
      <iframe title="Mô phỏng bóng cột đèn" src="../../truyen-thang-anh-sang/bong-cot-den.html?embed=1" allowfullscreen></iframe>
    </div>
  </div>
</div>
<script>
(function () {
  var btn = document.getElementById('simBtn');
  var wrap = document.getElementById('simWrap');
  if (!btn || !wrap) return;
  btn.addEventListener('click', function () {
    var open = wrap.classList.toggle('open');
    btn.textContent = open ? 'Ẩn mô phỏng' : 'Mô phỏng';
  });
})();
</script>
</body>
